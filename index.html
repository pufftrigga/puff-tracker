<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#061219">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Puff Tracker V4.1</title>
<style>
:root{--g:#22ef8b;--bg:#061219;--panel:#0d222b;--line:#1a3c46;--muted:#8ea2a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;overscroll-behavior:none}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#103642,#061219 42%);color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 20px)}
.app{max-width:520px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:23px;margin:0}.ver{font-size:11px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px}
.counter{text-align:center;padding:10px 0}.count{font-size:74px;font-weight:900;line-height:.95}.label{font-weight:800;margin-top:8px}.sub{color:var(--muted);font-size:13px;margin-top:6px}
.progress{height:10px;border-radius:10px;background:#183640;overflow:hidden;margin:18px 0 10px}.progress>div{height:100%;background:var(--g);width:0}.remain{color:var(--g);font-weight:800;text-align:center}
.tap-zone{width:100%;min-height:300px;margin:14px 0 12px;border:0;border-radius:34px;background:linear-gradient(145deg,#29f59a,#17d880);color:#042217;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 16px 36px rgba(34,239,139,.16);transition:transform .08s ease,filter .08s ease}
.tap-zone:active,.tap-zone.pressed{transform:scale(.985);filter:brightness(.92)}
.plus{font-size:76px;font-weight:500;line-height:.8}.tap-title{font-size:31px;font-weight:900;margin-top:14px}.tap-sub{font-size:13px;font-weight:700;opacity:.72;margin-top:6px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ctrl{border:1px solid var(--line);background:var(--panel);color:white;border-radius:18px;padding:15px;font-weight:800;touch-action:manipulation}.ctrl:active{background:#15313a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:12px;text-align:center}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{font-size:19px;display:block;margin-top:4px}
.feedback{height:25px;text-align:center;color:var(--g);font-size:13px;font-weight:800;margin-top:8px;opacity:0;transition:opacity .12s}.feedback.show{opacity:1}.quick-help{margin-top:14px;padding:13px;background:#0b1c24;border-radius:16px;color:var(--muted);font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div class="app">
<header><h1>☁ <span style="color:var(--g)">Puff</span> Tracker</h1><div class="ver">V4.1 Easy Tap</div></header>
<div class="card">
<div class="counter"><div class="count" id="count">0</div><div class="label">PUFFS TODAY</div><div class="sub">Target <span id="target">40</span> / day</div></div>
<div class="progress"><div id="bar"></div></div><div class="remain" id="remain"></div>
</div>
<button class="tap-zone" id="tapZone" type="button" aria-label="Add one puff"><div class="plus">＋</div><div class="tap-title">TAP = +1 PUFF</div><div class="tap-sub">Tap anywhere in this big area</div></button>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="controls"><button class="ctrl" id="undoBtn" type="button">↶ Undo Last</button><button class="ctrl" id="detailsBtn" type="button">✎ Details Later</button></div>
<div class="stats"><div class="stat"><span>Yesterday</span><b id="yday">—</b></div><div class="stat"><span>7-Day Avg</span><b id="avg">0</b></div><div class="stat"><span>Last Puff</span><b id="last">—</b></div></div>
<div class="quick-help">Double-tap zoom is disabled. You can tap quickly several times. If you add one too many, use <b>Undo Last</b>.</div>
</div>
<script>
const KEY="puffTrackerV3";let data={target:40,reduce:10,days:{}};
function dayKey(d=new Date()){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
function day(k=dayKey()){if(!data.days[k])data.days[k]={count:0,logs:[]};return data.days[k]}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)data={...data,...s}}catch{} render()}
function previous(n){const d=new Date();d.setDate(d.getDate()-n);return data.days[dayKey(d)]}
function showFeedback(t){feedback.textContent=t;feedback.classList.add("show");clearTimeout(window.ft);window.ft=setTimeout(()=>feedback.classList.remove("show"),650)}
function logPuff(source="Easy Tap"){const d=day();d.count++;d.logs=d.logs||[];d.logs.push({time:new Date().toISOString(),trigger:source,craving:0,note:""});save();render();showFeedback("+1 · "+d.count+" today");if(navigator.vibrate)navigator.vibrate(20)}
function undo(){const d=day();if(!d.count)return;d.count--;if(d.logs?.length)d.logs.pop();save();render();showFeedback("Undo · "+d.count+" today")}
function render(){const d=day(),pct=Math.min(100,(d.count/data.target)*100);count.textContent=d.count;target.textContent=data.target;bar.style.width=pct+"%";remain.textContent=Math.max(0,data.target-d.count)+" remaining";yday.textContent=previous(1)?.count??"—";const vals=[];for(let i=0;i<7;i++){const x=previous(i);if(x)vals.push(x.count)}avg.textContent=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):"0";last.textContent=d.logs?.length?new Date(d.logs[d.logs.length-1].time).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"—"}
tapZone.addEventListener("pointerdown",()=>tapZone.classList.add("pressed"));tapZone.addEventListener("pointerup",()=>tapZone.classList.remove("pressed"));tapZone.addEventListener("pointercancel",()=>tapZone.classList.remove("pressed"));tapZone.addEventListener("click",()=>logPuff("Easy Tap"));undoBtn.addEventListener("click",undo);detailsBtn.addEventListener("click",()=>showFeedback("Details can be added in the full log version"));
let lastTouchEnd=0;document.addEventListener("touchend",e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
function handleQuick(){const q=new URLSearchParams(location.search);if(q.get("quick")==="1"){logPuff("iPhone Shortcut");history.replaceState({},"",location.pathname)}}
load();handleQuick();if("serviceWorker"in navigator)navigator.serviceWorker.register("service-worker.js").catch(()=>{});
</script>
</body>
</html>

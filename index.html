<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Puff Tracker" />
  <meta name="theme-color" content="#07150f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Puff Tracker</title>
  <style>
    :root {
      --bg: #06130d;
      --panel: rgba(255,255,255,.055);
      --panel2: rgba(255,255,255,.085);
      --text: #f4f7f5;
      --muted: #9ca8a1;
      --green: #72e89b;
      --green2: #45c977;
      --danger: #ff6b60;
      --line: rgba(255,255,255,.10);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% -10%, rgba(76,211,126,.15), transparent 35%),
        linear-gradient(180deg, #07160f 0%, #06110c 55%, #050d09 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100vh;
      padding: calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 28px);
    }
    .app { max-width: 520px; margin: 0 auto; }
    header { display:flex; align-items:center; justify-content:space-between; margin: 4px 0 20px; }
    h1 { font-size: 30px; margin: 0; letter-spacing: -.6px; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 5px; }
    .gear {
      border: 0; background: var(--panel); color: var(--text);
      width: 44px; height:44px; border-radius: 14px; font-size: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.05);
      box-shadow: 0 12px 35px rgba(0,0,0,.18);
      border-radius: 24px;
      padding: 22px;
      backdrop-filter: blur(14px);
    }
    .today-label { color: #d9e2dd; font-size: 14px; }
    .count-wrap { text-align:center; padding: 18px 0 8px; }
    .ring {
      --p: 0deg;
      width: 212px; height: 212px; margin: 0 auto 12px;
      border-radius: 50%;
      display:grid; place-items:center;
      background: conic-gradient(var(--green) var(--p), rgba(114,232,155,.13) 0);
      position:relative;
    }
    .ring::after {
      content:""; position:absolute; inset:12px; border-radius:50%;
      background: #0b1d14;
    }
    .ring-inner { position:relative; z-index:1; text-align:center; }
    .count { font-size: 62px; font-weight: 800; line-height:.95; }
    .puffs { font-size: 16px; margin-top:8px; font-weight:700; letter-spacing:.5px; }
    .targetline { margin-top:6px; color: var(--muted); font-size: 14px; }
    .remaining { color: var(--green); font-weight:700; margin-top:12px; }
    .stats {
      display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0;
    }
    .stat {
      background: var(--panel);
      border-radius:18px;
      padding:16px;
    }
    .stat .label { color:var(--muted); font-size:12px; }
    .stat .value { font-size:23px; font-weight:800; margin-top:5px; }
    .puff-btn {
      width:100%; height:118px; border:0; border-radius:30px;
      background: linear-gradient(135deg, #86efaa, #4ed47f);
      color:#062311; box-shadow: 0 18px 40px rgba(61,204,112,.20);
      font-size:29px; font-weight:900; margin: 8px 0 12px;
      touch-action: manipulation;
    }
    .puff-btn small { display:block; font-size:13px; font-weight:600; margin-top:6px; opacity:.75; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .action {
      min-height:54px; border:0; border-radius:17px; background: var(--panel2);
      color:var(--text); font-size:15px; font-weight:700;
    }
    .danger { color: var(--danger); }
    .section-title { margin: 25px 2px 12px; font-size: 17px; font-weight:800; }
    .history-row {
      display:flex; justify-content:space-between; padding:14px 0;
      border-bottom:1px solid var(--line);
    }
    .history-row:last-child { border-bottom:0; }
    .history-date { color:#dce4df; }
    .history-count { font-weight:800; }
    .empty { color:var(--muted); padding: 14px 0; }
    .modal {
      position:fixed; inset:0; display:none; align-items:flex-end; justify-content:center;
      background:rgba(0,0,0,.58); padding:18px;
    }
    .modal.show { display:flex; }
    .sheet {
      width:min(520px,100%); background:#0d1b14; border-radius:26px;
      padding:22px; border:1px solid var(--line);
    }
    .sheet h2 { margin:0 0 16px; }
    input {
      width:100%; padding:16px; border-radius:16px; border:1px solid var(--line);
      background:#07130e; color:var(--text); font-size:20px;
    }
    .sheet-actions { display:flex; gap:10px; margin-top:16px; }
    .sheet-actions button { flex:1; padding:14px; border-radius:14px; border:0; font-weight:800; }
    .save { background:var(--green); color:#052010; }
    .cancel { background:var(--panel2); color:var(--text); }
    .note { color:var(--muted); font-size:13px; line-height:1.45; margin-top:12px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Puff Tracker</h1>
        <div class="sub">One puff at a time, better every day.</div>
      </div>
      <button class="gear" id="settingsBtn">⚙︎</button>
    </header>

    <div class="card">
      <div class="today-label" id="todayLabel">TODAY</div>

      <div class="count-wrap">
        <div class="ring" id="ring">
          <div class="ring-inner">
            <div class="count" id="count">0</div>
            <div class="puffs">PUFFS</div>
            <div class="targetline">of <span id="targetText">40</span> target</div>
          </div>
        </div>
        <div class="remaining"><span id="remaining">40</span> puffs remaining</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="label">Today Progress</div>
        <div class="value"><span id="percent">0</span>%</div>
      </div>
      <div class="stat">
        <div class="label">7-Day Average</div>
        <div class="value" id="average">0</div>
      </div>
    </div>

    <button class="puff-btn" id="puffBtn">
      + 1 PUFF
      <small>Tap every time you puff</small>
    </button>

    <div class="actions">
      <button class="action" id="undoBtn">↶ Undo</button>
      <button class="action danger" id="resetBtn">↻ Reset Day</button>
    </div>

    <div class="section-title">Last 7 Days</div>
    <div class="card" id="historyCard">
      <div class="empty">No history yet.</div>
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="sheet">
      <h2>Daily Target</h2>
      <input type="number" min="1" inputmode="numeric" id="targetInput" />
      <div class="note">Start by tracking your normal usage, then gradually lower this target.</div>
      <div class="sheet-actions">
        <button class="cancel" id="cancelSettings">Cancel</button>
        <button class="save" id="saveSettings">Save</button>
      </div>
    </div>
  </div>

<script>
const STORAGE_KEY = "puffTrackerDataV1";
const todayKey = () => new Date().toISOString().slice(0,10);

let data = {
  currentDate: todayKey(),
  count: 0,
  target: 40,
  history: {}
};

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) data = {...data, ...saved};
  } catch {}
  rollover();
  render();
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function rollover() {
  const t = todayKey();
  if (data.currentDate !== t) {
    data.history[data.currentDate] = data.count || 0;
    data.currentDate = t;
    data.count = 0;
    trimHistory();
    save();
  }
}

function trimHistory() {
  const keys = Object.keys(data.history).sort().reverse();
  keys.slice(30).forEach(k => delete data.history[k]);
}

function addPuff() {
  rollover();
  data.count++;
  save();
  if (navigator.vibrate) navigator.vibrate(40);
  render();
}

function undoPuff() {
  rollover();
  if (data.count > 0) data.count--;
  save();
  render();
}

function resetDay() {
  if (confirm("Reset today's puff count to zero?")) {
    data.count = 0;
    save();
    render();
  }
}

function formatDate(d) {
  const date = new Date(d + "T12:00:00");
  return date.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
}

function getLast7() {
  const arr = [];
  for (let i=0;i<7;i++) {
    const d = new Date();
    d.setHours(12,0,0,0);
    d.setDate(d.getDate()-i);
    const k = d.toISOString().slice(0,10);
    arr.push({key:k, count:k === data.currentDate ? data.count : (data.history[k] ?? null)});
  }
  return arr;
}

function render() {
  const pct = data.target > 0 ? Math.min(data.count / data.target, 1) : 0;
  document.getElementById("count").textContent = data.count;
  document.getElementById("targetText").textContent = data.target;
  document.getElementById("remaining").textContent = Math.max(data.target-data.count,0);
  document.getElementById("percent").textContent = Math.round((data.count/data.target)*100 || 0);
  document.getElementById("ring").style.setProperty("--p", `${pct*360}deg`);

  document.getElementById("todayLabel").textContent =
    "TODAY • " + new Date().toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});

  const last7 = getLast7();
  const numbers = last7.filter(x=>x.count!==null).map(x=>x.count);
  const avg = numbers.length ? (numbers.reduce((a,b)=>a+b,0)/numbers.length).toFixed(1) : "0";
  document.getElementById("average").textContent = avg;

  const card = document.getElementById("historyCard");
  const rows = last7.filter(x => x.count !== null);
  if (!rows.length) {
    card.innerHTML = '<div class="empty">No history yet.</div>';
  } else {
    card.innerHTML = rows.map(r =>
      `<div class="history-row">
        <div class="history-date">${r.key === data.currentDate ? "Today" : formatDate(r.key)}</div>
        <div class="history-count">${r.count} puffs</div>
      </div>`).join("");
  }
}

document.getElementById("puffBtn").addEventListener("click", addPuff);
document.getElementById("undoBtn").addEventListener("click", undoPuff);
document.getElementById("resetBtn").addEventListener("click", resetDay);

const modal = document.getElementById("settingsModal");
document.getElementById("settingsBtn").addEventListener("click", () => {
  document.getElementById("targetInput").value = data.target;
  modal.classList.add("show");
});
document.getElementById("cancelSettings").addEventListener("click", () => modal.classList.remove("show"));
document.getElementById("saveSettings").addEventListener("click", () => {
  const v = Number(document.getElementById("targetInput").value);
  if (Number.isFinite(v) && v > 0) data.target = Math.round(v);
  save(); render(); modal.classList.remove("show");
});

window.addEventListener("focus", () => { rollover(); render(); });
load();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js").catch(()=>{});
}
</script>
</body>
</html>
